name: Index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install the checker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refuse to index mods that fail the checks
        run: node scripts/validate.mjs
      - name: Build the index
        run: node scripts/build-index.mjs "$GITHUB_SHA" "$RUNNER_TEMP/index.json"
      - name: Publish the index branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf publish && mkdir publish && cd publish
          git init -q -b index
          cp "$RUNNER_TEMP/index.json" index.json
          git add index.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: index ${GITHUB_SHA::12}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index:index
